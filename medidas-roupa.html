<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Tamanho — Cláudio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --red: #ef4444; }
    body { background: #09090b; color: #fff; font-family: 'ui-monospace', monospace; }
    .glass { background: rgba(24,24,27,.8); border: 1px solid #27272a; border-radius: 16px; padding: 16px; }
    .input-m { background: rgba(39,39,42,.9); border: 1px solid #3f3f46; border-radius: 8px; padding: 10px 12px; width: 100%; color: #fff; font-family: inherit; font-size: 15px; text-align: center; transition: border-color .15s; -moz-appearance: textfield; }
    .input-m::-webkit-outer-spin-button, .input-m::-webkit-inner-spin-button { -webkit-appearance: none; }
    .input-m:focus { outline: none; border-color: var(--red); }
    .input-m::placeholder { color: #3f3f46; }
    .field-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #52525b; margin-bottom: 4px; }
    .section-title { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: #71717a; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .section-title::before { content: ''; display: block; height: 1px; width: 12px; background: #3f3f46; }
    .cat-btn { flex: 1; padding: 10px 4px; background: rgba(39,39,42,.4); border: 1px solid #27272a; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #71717a; cursor: pointer; transition: all .15s; text-align: center; }
    .cat-btn.active { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); color: #f87171; }
    .verdict-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 11px; }
    .verdict-ok  { background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.25); }
    .verdict-warn{ background: rgba(234,179,8,.08); border: 1px solid rgba(234,179,8,.25); }
    .verdict-bad { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }
    .size-row { border-bottom: 1px solid #18181b; }
    .size-row:last-child { border-bottom: none; }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  </style>
</head>
<body class="min-h-screen pb-20">
<div class="max-w-lg mx-auto px-4 pt-8 space-y-4">

  <!-- Header -->
  <div class="text-center mb-2">
    <div class="text-[10px] font-black tracking-[.2em] text-red-500 mb-1">⬡ NINJINHA BOM DE BRIGA ⬡</div>
    <h1 class="text-2xl font-black tracking-tight">CALCULADORA DE TAMANHO</h1>
    <p class="text-[11px] text-zinc-500 mt-1">Insira as medidas da marca · descobre o tamanho certo</p>
    <a href="index.html" class="text-[10px] text-red-500/50 hover:text-red-400 mt-2 inline-block">← voltar ao app</a>
  </div>

  <!-- Perfil Cláudio (fixo) -->
  <div class="glass" style="background:rgba(239,68,68,.04);border-color:rgba(239,68,68,.2)">
    <div class="section-title" style="margin-bottom:8px">Seu perfil (fixo)</div>
    <div class="grid grid-cols-4 gap-2 text-center">
      <div><div class="text-[8px] text-zinc-500 mb-1">ALTURA</div><div class="text-[13px] font-black text-red-400">188 cm</div></div>
      <div><div class="text-[8px] text-zinc-500 mb-1">TÓRAX</div><div class="text-[13px] font-black text-red-400">102 cm</div></div>
      <div><div class="text-[8px] text-zinc-500 mb-1">CINTURA</div><div class="text-[13px] font-black text-red-400">82 cm</div></div>
      <div><div class="text-[8px] text-zinc-500 mb-1">QUADRIL</div><div class="text-[13px] font-black text-red-400">95 cm</div></div>
    </div>
  </div>

  <!-- Categoria -->
  <div style="display:flex;gap:8px">
    <button class="cat-btn active" id="cat-top"    onclick="setCat('top')">👕 Camiseta / Polo / Moletom</button>
    <button class="cat-btn"        id="cat-bottom" onclick="setCat('bottom')">👖 Calça / Short</button>
    <button class="cat-btn"        id="cat-jacket" onclick="setCat('jacket')">🧥 Jaqueta</button>
  </div>

  <!-- Tabela de entrada -->
  <div class="glass space-y-3">
    <div class="section-title" id="formTitle">Informe as medidas da marca (cm)</div>

    <!-- Cabeçalho das colunas muda por categoria -->
    <div id="colHeaders" class="grid gap-2 text-center" style="grid-template-columns: 72px repeat(3, 1fr)">
      <div></div>
      <div class="field-label" style="color:#ef4444">COMP.</div>
      <div class="field-label" style="color:#3b82f6">LARGURA</div>
      <div class="field-label" style="color:#22c55e">MANGA</div>
    </div>

    <div id="sizeRows" class="space-y-2"></div>

    <div style="display:flex;gap:8px;margin-top:4px">
      <button onclick="addRow()" style="flex:1;padding:10px;background:rgba(39,39,42,.6);border:1px solid #3f3f46;border-radius:10px;color:#71717a;font-size:11px;font-weight:700;cursor:pointer">+ Tamanho</button>
      <button onclick="calcular()" style="flex:2;padding:10px;background:var(--red);color:#000;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;border:none;border-radius:10px;cursor:pointer">Calcular ▶</button>
    </div>
  </div>

  <!-- Resultado -->
  <div id="resultado" style="display:none"></div>

</div>
<script>
// ─── Perfil fixo Cláudio ───────────────────────────────────────────
const CLAUDIO = {
  altura:  188,
  torax:   102,  // circunferência
  cintura: 82,   // circunferência
  quadril: 95,   // circunferência
  braco:   37.5, // braço contraído
};

// ─── Limites por categoria ─────────────────────────────────────────
// "min" = mínimo aceitável; "ideal" = centro da zona boa; "max" = máximo tolerável
// Derivados do perfil: torax/2 = 51cm (largura plana mínima) + folga
const LIMITS = {
  top: {
    comp:   { min: 75, ideal: 78, max: 84,
              why: c => c < 75 ? 'curta demais (188 cm de altura — aparece a barriga ao levantar o braço)'
                       : c > 84 ? 'muito longa (fica abaixo do cós, efeito vestido)'
                       : c < 77 ? 'um pouco curta, cuidado'
                       : 'comprimento ok para 188 cm' },
    larg:   { min: 56, ideal: 62, max: 70,
              why: l => l < 56 ? 'apertada no peito (tórax 102 cm — mínimo de 56 cm plana)'
                       : l > 70 ? 'muito larga, perde o caimento'
                       : l < 59 ? 'serve mas ajustada'
                       : l < 65 ? 'largura ideal para V-taper'
                       : 'folgada — ok para over/moletom' },
    manga:  { min: 26, ideal: 29, max: 34,
              why: m => m < 26 ? 'manga muito curta para os braços de 188 cm'
                       : m > 34 ? 'manga muito comprida para camiseta'
                       : m < 28 ? 'manga um pouco curta'
                       : 'comprimento de manga ok' },
  },
  bottom: {
    comp:   { min: 98, ideal: 105, max: 115,
              why: c => c < 98 ? 'curta demais para pernas de 188 cm'
                       : c > 115 ? 'muito comprida, sobra no chão'
                       : c < 102 ? 'um pouco curta, fica na canela'
                       : 'comprimento ok' },
    cintura:{ min: 38, ideal: 43, max: 50,
              why: c => c < 38 ? 'não fecha — cintura 82 cm (mínimo plano 41 cm)'
                       : c > 50 ? 'muito larga, cai sem cinto'
                       : c < 41 ? 'muito justa, difícil de fechar'
                       : c < 46 ? 'cintura ok'
                       : 'cintura folgada — precisa de cinto' },
    quadril:{ min: 48, ideal: 53, max: 62,
              why: q => q < 48 ? 'aperta no quadril/coxa (quadril 95 cm — mínimo 48 cm plano)'
                       : q > 62 ? 'muito largo, cai do quadril'
                       : q < 51 ? 'um pouco justo nas coxas'
                       : 'quadril ok' },
    entre:  { min: 75, ideal: 82, max: 92,
              why: e => e < 75 ? 'entreperna curta para pernas de 188 cm'
                       : e > 92 ? 'muito comprida, sobra no chão'
                       : e < 78 ? 'um pouco curta'
                       : 'entreperna ok' },
  },
  jacket: {
    comp:   { min: 68, ideal: 73, max: 80,
              why: c => c < 68 ? 'curta demais para 188 cm'
                       : c > 80 ? 'muito longa'
                       : c < 71 ? 'um pouco curta'
                       : 'comprimento ok' },
    larg:   { min: 56, ideal: 62, max: 70,
              why: l => l < 56 ? 'apertada no peito'
                       : l > 70 ? 'muito larga'
                       : l < 59 ? 'ajustada'
                       : 'largura ok' },
    manga:  { min: 62, ideal: 66, max: 72,
              why: m => m < 62 ? 'manga curta para braços de 188 cm'
                       : m > 72 ? 'manga comprida demais'
                       : m < 64 ? 'um pouco curta'
                       : 'manga ok' },
    ombro:  { min: 44, ideal: 48, max: 54,
              why: o => o < 44 ? 'ombro pequeno — costura cai no braço'
                       : o > 54 ? 'ombro grande demais'
                       : o < 46 ? 'ombro um pouco justo'
                       : 'ombro ok' },
  },
};

const COLS = {
  top:    [['comp','Comp.','#ef4444'],['larg','Largura','#3b82f6'],['manga','Manga','#22c55e']],
  bottom: [['comp','Comp.','#ef4444'],['cintura','Cintura','#a855f7'],['quadril','Quadril','#f59e0b'],['entre','Entreperna','#22c55e']],
  jacket: [['comp','Comp.','#ef4444'],['larg','Largura','#3b82f6'],['manga','Manga','#22c55e'],['ombro','Ombro','#f59e0b']],
};

let cat = 'top';
let rowCount = 0;

function setCat(c) {
  cat = c;
  ['top','bottom','jacket'].forEach(x => document.getElementById('cat-'+x).classList.toggle('active', x===c));
  document.getElementById('resultado').style.display = 'none';
  rebuildForm();
}

function rebuildForm() {
  const cols = COLS[cat];
  const colCount = cols.length;
  const gridCols = `72px repeat(${colCount}, 1fr)`;

  // cabeçalho
  document.getElementById('colHeaders').style.gridTemplateColumns = gridCols;
  document.getElementById('colHeaders').innerHTML =
    '<div></div>' + cols.map(([k,label,color]) =>
      `<div class="field-label" style="color:${color};text-align:center">${label}</div>`
    ).join('');

  // reinicia linhas com 3 padrão (P, M, G, GG, XGG ou S/M/L/XL)
  rowCount = 0;
  document.getElementById('sizeRows').innerHTML = '';
  ['P','M','G','GG','XGG'].forEach(sz => addRow(sz));
}

function addRow(label) {
  const cols = COLS[cat];
  const colCount = cols.length;
  const gridCols = `72px repeat(${colCount}, 1fr)`;
  const id = ++rowCount;

  const inputs = cols.map(([k,label,color]) =>
    `<input class="input-m" type="number" inputmode="decimal" min="1" max="300" step="0.5"
            id="r${id}_${k}" placeholder="—"
            style="padding:8px 4px;font-size:13px">`
  ).join('');

  const div = document.createElement('div');
  div.className = 'size-row';
  div.style.cssText = `display:grid;gap:6px;align-items:center;padding:6px 0;grid-template-columns:${gridCols}`;
  div.innerHTML = `
    <input class="input-m" id="r${id}_label" value="${label||''}"
           placeholder="tam" style="padding:8px 4px;font-size:12px;font-weight:700;text-transform:uppercase">
    ${inputs}
  `;
  document.getElementById('sizeRows').appendChild(div);
}

function score(val, lim) {
  if (val == null || isNaN(val)) return null;
  if (val < lim.min) return 'bad';
  if (val > lim.max) return 'bad';
  if (val < lim.min + (lim.ideal - lim.min) * 0.4) return 'warn';
  if (val > lim.ideal + (lim.max - lim.ideal) * 0.7) return 'warn';
  return 'ok';
}

function calcular() {
  const cols  = COLS[cat];
  const lims  = LIMITS[cat];
  const rows  = [];

  for (let i = 1; i <= rowCount; i++) {
    const el = document.getElementById(`r${i}_label`);
    if (!el) continue;
    const label = el.value.trim() || `T${i}`;
    const vals = {};
    cols.forEach(([k]) => {
      const v = parseFloat(document.getElementById(`r${i}_${k}`)?.value);
      if (!isNaN(v) && v > 0) vals[k] = v;
    });
    if (Object.keys(vals).length > 0) rows.push({ label, vals });
  }

  if (!rows.length) return;

  // score global de cada tamanho
  const scored = rows.map(r => {
    const details = [];
    let bad = 0, warn = 0, ok = 0;
    cols.forEach(([k, colLabel, color]) => {
      const v = r.vals[k];
      if (v == null) return;
      const s = score(v, lims[k]);
      if (s === 'bad')  bad++;
      if (s === 'warn') warn++;
      if (s === 'ok')   ok++;
      details.push({ key: k, label: colLabel, color, val: v, status: s, why: lims[k].why(v) });
    });
    const overall = bad > 0 ? 'bad' : warn > 0 ? 'warn' : 'ok';
    return { ...r, details, bad, warn, ok, overall };
  });

  // melhor tamanho
  const best = scored.filter(r => r.overall !== 'bad').sort((a,b) => a.warn - b.warn || a.bad - b.bad)[0];

  const icon = { ok: '✅', warn: '⚠️', bad: '❌' };
  const tag  = { ok: '#22c55e', warn: '#eab308', bad: '#ef4444' };
  const tagBg= { ok: 'rgba(34,197,94,.12)', warn: 'rgba(234,179,8,.12)', bad: 'rgba(239,68,68,.1)' };
  const tagBorder = { ok: 'rgba(34,197,94,.3)', warn: 'rgba(234,179,8,.3)', bad: 'rgba(239,68,68,.25)' };
  const tagLabel = { ok: 'SERVE', warn: 'BORDA', bad: 'NÃO SERVE' };

  let html = '';

  // destaque do melhor
  if (best) {
    html += `<div class="glass" style="border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.06);margin-bottom:0">
      <div style="font-size:10px;color:#4ade80;font-weight:700;margin-bottom:4px">RECOMENDAÇÃO</div>
      <div style="font-size:28px;font-weight:900;line-height:1">${best.label}</div>
      <div style="font-size:11px;color:#86efac;margin-top:4px">${best.warn > 0 ? 'Melhor opção disponível — ver observações abaixo' : 'Tamanho ideal para seu corpo'}</div>
    </div>`;
  } else {
    html += `<div class="glass" style="border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06)">
      <div style="font-size:12px;font-weight:700;color:#f87171">Nenhum tamanho serve</div>
      <div style="font-size:11px;color:#71717a;margin-top:4px">Esta marca não tem corte para suas medidas. Veja os detalhes abaixo.</div>
    </div>`;
  }

  // tabela de todos os tamanhos
  html += `<div class="glass space-y-3" style="margin-top:0">
    <div class="section-title">Análise por tamanho</div>`;

  for (const r of scored) {
    const isBest = best && r.label === best.label;
    html += `<div style="border:1px solid ${isBest ? 'rgba(34,197,94,.3)' : '#1f1f23'};border-radius:12px;padding:12px;background:${isBest ? 'rgba(34,197,94,.04)' : 'transparent'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:18px;font-weight:900">${r.label}</span>
        <span class="pill" style="background:${tagBg[r.overall]};border:1px solid ${tagBorder[r.overall]};color:${tag[r.overall]}">${icon[r.overall]} ${tagLabel[r.overall]}</span>
        ${isBest ? '<span class="pill" style="background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80">★ MELHOR</span>' : ''}
      </div>`;

    for (const d of r.details) {
      if (d.status == null) continue;
      html += `<div class="verdict-row verdict-${d.status}" style="margin-bottom:4px">
        <span style="font-size:16px">${icon[d.status]}</span>
        <div style="flex:1">
          <span style="color:${d.color};font-weight:700;font-size:10px">${d.label}</span>
          <span style="color:#a1a1aa;margin-left:6px">${d.val} cm</span>
          <div style="font-size:10px;color:${d.status==='ok'?'#86efac':d.status==='warn'?'#fde047':'#f87171'};margin-top:1px">${d.why}</div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  const el = document.getElementById('resultado');
  el.style.display = '';
  el.innerHTML = `<div class="space-y-3">${html}</div>`;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// init
rebuildForm();
</script>
</body>
</html>
